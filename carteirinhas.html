<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carteirinha Escolar</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f1f3f5;
    text-align:center;
    margin:0;
    padding:20px;
}

.formulario{
    background:white;
    max-width:500px;
    margin:auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

input{
    width:90%;
    padding:10px;
    margin:6px;
    font-size:16px;
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:16px;
    cursor:pointer;
}

.carteira{
    width:430px;
    height:260px;
    background:white;
    margin:30px auto;
    border:2px solid #222;
    border-radius:15px;
    padding:15px;
    box-sizing:border-box;
    position:relative;
}

.logo{
    width:65px;
    height:65px;
    object-fit:contain;
}

.foto{
    width:110px;
    height:135px;
    object-fit:cover;
    border:2px solid #333;
    float:left;
    margin-right:15px;
}

.dados{
    text-align:left;
    font-size:15px;
}

.codigo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:4px;
    margin-top:15px;
}

@media print{

    body *{
        visibility:hidden;
    }

    #carteira,
    #carteira *{
        visibility:visible;
    }

    #carteira{
        position:absolute;
        left:0;
        top:0;
    }
}
</style>
</head>

<body>

<div class="formulario">

<h2>Gerador de Carteirinha Escolar</h2>

<input id="codigo" placeholder="Código do aluno - Ex: ALU001">

<input id="nome" placeholder="Nome do aluno">

<input id="turma" placeholder="Turma">

<br>

<button onclick="gerar()">Gerar Carteirinha</button>

<button onclick="window.print()">Imprimir</button>

</div>

<div id="carteira" class="carteira">

<img src="logo1.jpg" class="logo">

<h3>CEMSTIAC</h3>

<img id="fotoAluno" class="foto">

<div class="dados">

<p><b>Aluno:</b> <span id="nomeCarteira"></span></p>

<p><b>Turma:</b> <span id="turmaCarteira"></span></p>

<p><b>Código:</b> <span id="codigoCarteira"></span></p>

</div>

<div style="clear:both"></div>

<div id="codigoGrande" class="codigo"></div>

</div>


<script>

function gerar(){

let codigo =
document.getElementById("codigo").value.trim().toUpperCase();

let nome =
document.getElementById("nome").value;

let turma =
document.getElementById("turma").value;

document.getElementById("nomeCarteira").innerText = nome;

document.getElementById("turmaCarteira").innerText = turma;

document.getElementById("codigoCarteira").innerText = codigo;

document.getElementById("codigoGrande").innerText = codigo;

document.getElementById("fotoAluno").src =
"Alunos/" + codigo + ".jpg";

}

</script>

</body>
</html>
