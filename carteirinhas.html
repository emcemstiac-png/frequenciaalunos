<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha Escolar</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px;
    font-family:Arial, sans-serif;
    background:#eef4fa;
    color:#0b355e;
}

.formulario{
    max-width:720px;
    margin:0 auto 30px;
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.formulario label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:5px;
}

.formulario input{
    width:100%;
    padding:12px;
    font-size:17px;
    border:1px solid #bbb;
    border-radius:7px;
}

.botoes{
    text-align:center;
    margin-top:20px;
}

button{
    border:0;
    padding:13px 30px;
    margin:5px 10px;
    border-radius:7px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.gerar{
    background:#1677ee;
    color:white;
}

.imprimir{
    background:#23ad4b;
    color:white;
}

/* CARTEIRINHA */

.carteira{
    width:700px;
    height:480px;
    margin:0 auto;
    background:white;
    border:2px solid #12395d;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.topo{
    height:140px;
    display:flex;
    align-items:center;
    padding:18px 35px;
}

.logo{
    width:115px;
    height:100px;
    object-fit:contain;
}

.titulo{
    flex:1;
    text-align:center;
}

.titulo h1{
    margin:0;
    font-size:42px;
    color:#063c6c;
    letter-spacing:2px;
}

.titulo p{
    margin:4px 0;
    font-size:17px;
    font-weight:bold;
}

.linha{
    height:4px;
    background:#0a4f82;
    width:90%;
    margin:8px auto 0;
}

.conteudo{
    height:250px;
    display:flex;
    padding:12px 28px;
}

.foto-area{
    width:190px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.foto{
    width:180px;
    height:220px;
    object-fit:cover;
    border:3px solid #0b4e80;
    border-radius:14px;
    display:block;
}

.dados{
    flex:1;
    padding:10px 0 0 25px;
    font-size:20px;
    color:#111;
}

.dados strong{
    color:#0a3e6b;
}

.nome{
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.valor{
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.rodape{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:90px;
    background:#073f6c;
    display:flex;
    align-items:center;
    padding:10px 35px;
}

.codigo-grande{
    width:220px;
    color:white;
    font-size:40px;
    font-weight:bold;
}

.barcode{
    flex:1;
    height:66px;
    background:white;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.barras{
    width:92%;
    height:50px;
    background:
    repeating-linear-gradient(
        90deg,
        #000 0px,
        #000 3px,
        #fff 3px,
        #fff 5px,
        #000 5px,
        #000 7px,
        #fff 7px,
        #fff 11px
    );
}

.aviso{
    text-align:center;
    margin-top:15px;
    color:#555;
}

@media print{

    body{
        background:white;
        padding:0;
    }

    body *{
        visibility:hidden;
    }

    .carteira,
    .carteira *{
        visibility:visible;
    }

    .carteira{
        position:absolute;
        left:0;
        top:0;
        box-shadow:none;
    }
}

</style>
</head>

<body>

<div class="formulario">

<label>Código do aluno - Ex: ALU001</label>
<input id="codigo" placeholder="ALU001">

<label>Nome do aluno</label>
<input id="nome" placeholder="Nome completo">

<label>Turma</label>
<input id="turma" placeholder="6AM01">

<div class="botoes">
<button class="
<button class="gerar" onclick="gerar()">Gerar Carteirinha</button>
<button class="imprimir" onclick="window.print()">Imprimir</button>
</div>

</div>

<div class="carteira">

<div class="topo">

<img src="logo1.jpg" class="logo">

<div class="titulo">
<h1>CEMSTIAC</h1>
<p>Centro Municipal de Educação em</p>
<p>Ciência, Tecnologia, Inovação, Arte e Cultura</p>
<div class="linha"></div>
</div>

</div>

<div class="conteudo">

<div class="foto-area">
<img id="fotoAluno" class="foto">
</div>

<div class="dados">

<strong>Aluno:</strong>
<div id="nomeCarteira" class="nome"></div>

<strong>Turma:</strong>
<div id="turmaCarteira" class="valor"></div>

<strong>Código:</strong>
<div id="codigoCarteira" class="valor"></div>

</div>

</div>

<div class="rodape">

<div id="codigoGrande" class="codigo-grande"></div>

<div class="barcode">
<div class="barras"></div>
</div>

</div>

</div>

<div class="aviso">
Mostre esta carteirinha no leitor para registrar sua entrada e saída.
</div>

<script>
function gerar(){

    const codigo =
    document.getElementById("codigo").value.trim().toUpperCase();

    const nome =
    document.getElementById("nome").value.trim();

    const turma =
    document.getElementById("turma").value.trim().toUpperCase();

    document.getElementById("nomeCarteira").innerText = nome;
    document.getElementById("turmaCarteira").innerText = turma;
    document.getElementById("codigoCarteira").innerText = codigo;
    document.getElementById("codigoGrande").innerText = codigo;

    document.getElementById("fotoAluno").src =
    "Alunos/" + codigo + ".jpg";
}
</script>

</body>
</html>
