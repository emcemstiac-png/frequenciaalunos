<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha Escolar - CEMSTIAC</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:25px 12px;
  font-family:Arial,sans-serif;
  background:#eef4fa;
  color:#0b355e;
}

.formulario{
  max-width:700px;
  margin:0 auto 25px;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

label{
  display:block;
  font-weight:bold;
  margin:10px 0 5px;
}

input{
  width:100%;
  padding:11px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:7px;
}

.botoes{
  text-align:center;
  margin-top:18px;
}

button{
  border:0;
  padding:12px 24px;
  margin:5px;
  border-radius:7px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.gerar{background:#1677ee}
.imprimir{background:#23ad4b}

.area{
  width:100%;
  overflow-x:auto;
}

.carteira{
  width:700px;
  height:480px;
  margin:auto;
  background:#fff;
  border:2px solid #12395d;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}

.topo{
  height:135px;
  display:flex;
  align-items:center;
  padding:15px 30px;
}

.logo{
  width:105px;
  height:95px;
  object-fit:contain;
}

.titulo{
  flex:1;
  text-align:center;
}

.titulo h1{
  margin:0;
  font-size:40px;
  color:#063c6c;
}

.titulo p{
  margin:3px 0;
  font-size:16px;
  font-weight:bold;
}

.linha{
  height:4px;
  background:#0a4f82;
  margin-top:8px;
}

.conteudo{
  height:255px;
  display:flex;
  padding:10px 28px;
  overflow:hidden;
}

.foto{
  width:180px;
  height:225px;
  object-fit:cover;
  border:3px solid #0b4e80;
  border-radius:14px;
  flex-shrink:0;
}

.dados{
  padding-left:24px;
  color:#111;
}

.rotulo{
  color:#0a3e6b;
  font-weight:bold;
  font-size:16px;
}

.valor{
  font-size:20px;
  font-weight:bold;
  margin-bottom:9px;
}

.nome{
  font-size:22px;
  line-height:1.1;
}

.rodape{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:90px;
  background:#073f6c;
  display:flex;
  align-items:center;
  gap:20px;
  padding:10px 28px;
}

.codigo-grande{
  width:200px;
  color:#fff;
  font-size:38px;
  font-weight:bold;
  text-align:center;
}

.barcode{
  flex:1;
  height:68px;
  background:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px;
}

#codigoBarras{
  max-width:100%;
  height:55px;
}

@media print{
  body{background:#fff;padding:0}
  .formulario{display:none}
  .carteira{box-shadow:none}
}
</style>
</head>

<body>

<div class="formulario">

<label>Código do aluno</label>
<input id="codigo" placeholder="Ex: ALU001">

<label>Nome do aluno</label>
<input id="nome" placeholder="Nome completo">

<label>Turma</label>
<input id="turma" placeholder="Ex: 6AM01">

<label>Telefone de contato</label>
<input id="telefone" placeholder="Ex: (22) 99999-9999">

<div class="botoes">
  <button class="gerar" onclick="gerar()">Gerar Carteirinha</button>
  <button class="imprimir" onclick="window.print()">Imprimir</button>
</div>

</div>

<div class="area">

<div class="carteira">

<div class="topo">

<img src="logo1.jpg" class="logo">

<div class="titulo">
  <h1>CEMSTIAC</h1>
  <p>Centro Municipal de Educação em</p>
  <p>Ciência, Tecnologia, Inovação, Arte e Cultura</p>
  <div class="linha"></div>
</div>

</div>

<div class="conteudo">

<img id="fotoAluno" class="foto">

<div class="dados">

<div class="rotulo">Aluno:</div>
<div id="nomeCarteira" class="valor nome">Nome do aluno</div>

<div class="rotulo">Turma:</div>
<div id="turmaCarteira" class="valor">---</div>

<div class="rotulo">Telefone:</div>
<div id="telefoneCarteira" class="valor">---</div>

<div class="rotulo">Código:</div>
<div id="codigoCarteira" class="valor">---</div>

</div>

</div>

<div class="rodape">

<div id="codigoGrande" class="codigo-grande">ALU000</div>

<div class="barcode">
  <svg id="codigoBarras"></svg>
</div>

</div>

</div>
</div>

<script>
function gerar(){

  const codigo =
    document.getElementById("codigo").value.trim().toUpperCase();

  const nome =
    document.getElementById("nome").value.trim();

  const turma =
    document.getElementById("turma").value.trim().toUpperCase();

  const telefone =
    document.getElementById("telefone").value.trim();

  if(!codigo || !nome || !turma){
    alert("Preencha código, nome e turma.");
    return;
  }

  document.getElementById("nomeCarteira").textContent = nome;
  document.getElementById("turmaCarteira").textContent = turma;
  document.getElementById("telefoneCarteira").textContent =
    telefone || "Não informado";
  document.getElementById("codigoCarteira").textContent = codigo;
  document.getElementById("codigoGrande").textContent = codigo;

  const foto = document.getElementById("fotoAluno");

  foto.src = "Alunos/" + codigo + ".jpg";

  foto.onerror = function(){
    alert("Foto " + codigo + ".jpg não encontrada.");
  };

  JsBarcode("#codigoBarras", codigo, {
    format:"CODE128",
    width:2,
    height:45,
    displayValue:false,
    margin:2
  });
}
</script>

</body>
</html>
